<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CBT Exam - RPrep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
        }

        /* LANDSCAPE WARNING */
        .rotate-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }

        .rotate-warning i {
            font-size: 60px;
            animation: rotateAnim 2s ease infinite;
        }

        .rotate-warning h2 {
            font-size: 22px;
            margin-top: 20px;
        }

        .rotate-warning p {
            font-size: 14px;
            margin-top: 12px;
            opacity: 0.9;
        }

        @keyframes rotateAnim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        @media (orientation: portrait) {
            .rotate-warning { display: flex !important; }
            .exam-container { display: none !important; }
        }

        @media (orientation: landscape) {
            .rotate-warning { display: none !important; }
            .exam-container { display: block !important; }
        }

        /* CBT EXAM CONTAINER */
        .exam-container {
            display: none;
            width: 100%;
            height: 100vh;
            background: #f0f2f5;
        }

        /* Header */
        .exam-header {
            background: #ffffff;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e4e8;
            height: 56px;
        }

        .exam-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e3c72;
        }

        .exam-title span {
            color: #e74c3c;
        }

        .timer-box {
            background: #1e3c72;
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            font-size: 18px;
            font-family: monospace;
        }

        .timer-box.warning {
            background: #e74c3c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Main Content */
        .exam-main {
            display: flex;
            height: calc(100vh - 56px);
            padding: 12px;
            gap: 12px;
        }

        /* Left Side - Question Area */
        .question-area {
            flex: 3;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .question-header {
            background: #f8f9fc;
            padding: 12px 20px;
            border-bottom: 1px solid #e0e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .q-number {
            font-weight: 700;
            color: #1e3c72;
            font-size: 14px;
        }

        .q-number span {
            background: #1e3c72;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            margin-right: 10px;
        }

        .mark-review-btn {
            background: #ffc10720;
            border: 1px solid #ffc107;
            color: #d4a000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .mark-review-btn.marked {
            background: #ffc107;
            color: #333;
        }

        .question-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            background: #f8f9fc;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .option:hover {
            background: #eef2ff;
        }

        .option.selected {
            background: #eef2ff;
            border-color: #1e3c72;
        }

        .option-prefix {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #1e3c72;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .option.selected .option-prefix {
            background: #1e3c72;
            color: white;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            color: #333;
        }

        /* Navigation Buttons */
        .nav-buttons {
            padding: 16px 20px;
            border-top: 1px solid #e0e4e8;
            display: flex;
            justify-content: space-between;
            background: #f8f9fc;
        }

        .nav-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .prev-btn {
            background: #e0e0e0;
            color: #333;
        }

        .next-btn {
            background: #1e3c72;
            color: white;
        }

        .submit-btn {
            background: #e74c3c;
            color: white;
        }

        .prev-btn:disabled, .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Right Side - Palette Area */
        .palette-area {
            flex: 1;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 260px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .palette-header {
            background: #f8f9fc;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: #1e3c72;
            border-bottom: 1px solid #e0e4e8;
        }

        .palette-grid {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-y: auto;
        }

        .palette-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            background: #f0f0f0;
            color: #333;
        }

        .palette-btn.answered {
            background: #2ecc71;
            color: white;
        }

        .palette-btn.marked {
            background: #ffc107;
            color: #333;
        }

        .palette-btn.current {
            background: #1e3c72;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 0 2px white, 0 0 0 4px #1e3c72;
        }

        .palette-btn.not-answered {
            background: #e74c3c;
            color: white;
        }

        .legend {
            padding: 12px 16px;
            border-top: 1px solid #e0e4e8;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Warning for Portrait Mode -->
    <div class="rotate-warning">
        <i class="fas fa-rotate-right"></i>
        <h2>Rotate Your Device</h2>
        <p>Please rotate to Landscape Mode for CBT Exam</p>
        <p style="font-size: 12px; margin-top: 16px;">Exam will start automatically after rotation</p>
    </div>

    <!-- Main CBT Exam Container -->
    <div class="exam-container" id="examContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 16px;">Loading Exam...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;
        let questions = [];
        let userAnswers = [];
        let markedForReview = [];
        let currentIndex = 0;
        let timer = null;
        let timeLeft = 0;
        
        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('subject') || sessionStorage.getItem('testSubject') || 'Medical Surgical Nursing';
        const testNum = urlParams.get('test') || sessionStorage.getItem('testId') || '1';
        const testTopic = urlParams.get('topic') || sessionStorage.getItem('testTopic') || 'General';
        
        const storedQuestions = sessionStorage.getItem('testQuestions');
        if (storedQuestions) {
            questions = JSON.parse(storedQuestions);
        } else {
            // Sample CBT Questions
            questions = [
                { text: "A 55-year-old male presents with crushing chest pain radiating to left arm. ECG shows ST elevation. What is the most likely diagnosis?", options: ["Unstable Angina", "Myocardial Infarction", "Pericarditis", "Aortic Dissection"], correct: 1 },
                { text: "Which of the following is the first-line medication for hypertension in diabetic patients?", options: ["ACE Inhibitors", "Beta Blockers", "Calcium Channel Blockers", "Thiazide Diuretics"], correct: 0 },
                { text: "Normal adult respiratory rate range is:", options: ["8-12 breaths/min", "12-20 breaths/min", "20-28 breaths/min", "28-36 breaths/min"], correct: 1 },
                { text: "The most common site for taking pulse in an unconscious patient is:", options: ["Radial artery", "Brachial artery", "Carotid artery", "Femoral artery"], correct: 2 },
                { text: "Which blood group is known as universal donor?", options: ["A Positive", "B Positive", "AB Positive", "O Negative"], correct: 3 },
                { text: "The normal adult heart rate range is:", options: ["40-60 bpm", "60-100 bpm", "80-120 bpm", "100-140 bpm"], correct: 1 },
                { text: "Which of the following is a sign of hypoxia?", options: ["Bradycardia", "Hypotension", "Cyanosis", "Hyperventilation"], correct: 2 },
                { text: "The drug of choice for cardiac arrest is:", options: ["Atropine", "Amiodarone", "Epinephrine", "Lidocaine"], correct: 2 }
            ];
        }
        
        userAnswers = new Array(questions.length).fill(null);
        markedForReview = new Array(questions.length).fill(false);
        timeLeft = questions.length * 75;
        
        function saveProgress() {
            sessionStorage.setItem('cbt_userAnswers', JSON.stringify(userAnswers));
            sessionStorage.setItem('cbt_markedForReview', JSON.stringify(markedForReview));
            sessionStorage.setItem('cbt_currentIndex', currentIndex);
            sessionStorage.setItem('cbt_timeLeft', timeLeft);
        }
        
        function loadProgress() {
            const savedAnswers = sessionStorage.getItem('cbt_userAnswers');
            const savedMarked = sessionStorage.getItem('cbt_markedForReview');
            const savedIndex = sessionStorage.getItem('cbt_currentIndex');
            const savedTime = sessionStorage.getItem('cbt_timeLeft');
            if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
            if (savedMarked) markedForReview = JSON.parse(savedMarked);
            if (savedIndex) currentIndex = parseInt(savedIndex);
            if (savedTime) timeLeft = parseInt(savedTime);
        }
        
        loadProgress();
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            startExam();
        });
        
        function startExam() {
            startTimer();
            renderExam();
        }
        
        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitExam();
                } else {
                    timeLeft--;
                    updateTimer();
                    saveProgress();
                }
            }, 1000);
        }
        
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerEl = document.getElementById('timerDisplay');
            if (timerEl) {
                timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                if (timeLeft < 300) timerEl.classList.add('warning');
            }
        }
        
        function renderExam() {
            const container = document.getElementById('examContainer');
            const question = questions[currentIndex];
            if (!question) return;
            
            // Build palette
            let paletteHtml = '';
            questions.forEach((_, idx) => {
                let status = 'not-answered';
                if (userAnswers[idx] !== null) status = 'answered';
                else if (markedForReview[idx]) status = 'marked';
                if (idx === currentIndex) status = 'current';
                paletteHtml += `<button class="palette-btn ${status}" onclick="goToQuestion(${idx})">${idx+1}</button>`;
            });
            
            const isMarked = markedForReview[currentIndex];
            
            container.innerHTML = `
                <div class="exam-header">
                    <div class="exam-title">
                        <i class="fas fa-stethoscope"></i> RPrep CBT | <span>${subjectId}</span> | Test ${testNum}
                    </div>
                    <div class="timer-box" id="timerDisplay">00:00</div>
                </div>
                
                <div class="exam-main">
                    <!-- Left: Question Area -->
                    <div class="question-area">
                        <div class="question-header">
                            <div class="q-number">
                                <span>Q${currentIndex+1}/${questions.length}</span>
                                ${testTopic}
                            </div>
                            <button class="mark-review-btn ${isMarked ? 'marked' : ''}" onclick="toggleMarkForReview()">
                                <i class="fas fa-flag"></i> ${isMarked ? 'Marked for Review' : 'Mark for Review'}
                            </button>
                        </div>
                        
                        <div class="question-body">
                            <div class="question-text">${escapeHtml(question.text)}</div>
                            <div class="options">
                                ${question.options.map((opt, idx) => `
                                    <div class="option ${userAnswers[currentIndex] === idx ? 'selected' : ''}" onclick="selectOption(${idx})">
                                        <span class="option-prefix">${String.fromCharCode(65+idx)}</span>
                                        <span class="option-text">${escapeHtml(opt)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="nav-buttons">
                            <button class="nav-btn prev-btn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>
                                <i class="fas fa-arrow-left"></i> Previous
                            </button>
                            <div>
                                ${currentIndex === questions.length - 1 ? 
                                    `<button class="nav-btn submit-btn" onclick="submitExam()">Submit Exam ✓</button>` :
                                    `<button class="nav-btn next-btn" onclick="nextQuestion()">Save & Next <i class="fas fa-arrow-right"></i></button>`
                                }
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right: Palette Area -->
                    <div class="palette-area">
                        <div class="palette-header">
                            <i class="fas fa-th"></i> Question Palette
                        </div>
                        <div class="palette-grid">
                            ${paletteHtml}
                        </div>
                        <div class="legend">
                            <div class="legend-item"><div class="legend-color" style="background:#2ecc71;"></div> Answered</div>
                            <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div> Not Answered</div>
                            <div class="legend-item"><div class="legend-color" style="background:#ffc107;"></div> Marked</div>
                            <div class="legend-item"><div class="legend-color" style="background:#1e3c72;"></div> Current</div>
                        </div>
                    </div>
                </div>
            `;
            updateTimer();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function selectOption(optionIndex) {
            userAnswers[currentIndex] = optionIndex;
            renderExam();
            saveProgress();
        }
        
        function toggleMarkForReview() {
            markedForReview[currentIndex] = !markedForReview[currentIndex];
            renderExam();
            saveProgress();
        }
        
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderExam();
                saveProgress();
            }
        }
        
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderExam();
                saveProgress();
            }
        }
        
        function goToQuestion(index) {
            currentIndex = index;
            renderExam();
            saveProgress();
        }
        
        function submitExam() {
            if (!confirm('Are you sure you want to submit the exam?')) return;
            
            clearInterval(timer);
            let correctCount = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) correctCount++;
            });
            
            const score = correctCount;
            const total = questions.length;
            const percentage = Math.round((score / total) * 100);
            
            const results = {
                subject: subjectId,
                testId: testNum,
                topic: testTopic,
                score: score,
                total: total,
                percentage: percentage,
                questions: questions,
                userAnswers: userAnswers,
                date: new Date().toISOString()
            };
            
            sessionStorage.setItem('testResults', JSON.stringify(results));
            
            if (currentUser) {
                db.collection('results').add({
                    userId: currentUser.uid,
                    subject: subjectId,
                    testId: testNum,
                    score: score,
                    total: total,
                    percentage: percentage,
                    date: new Date()
                }).catch(e => console.log(e));
            }
            
            window.location.href = 'result.html';
        }
    </script>
<script src="app-update.js"></script>
</body>
</html>
