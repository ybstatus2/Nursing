<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Subjects - RPrep Nursing Exam Prep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef9f0 0%, #fff5e6 100%);
        }

        .header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #e74c3c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 0.7rem;
            color: #e74c3c;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #1e3c72;
            display: none;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: #e74c3c;
            color: white;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid #e74c3c;
            color: #e74c3c;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #e74c3c;
            color: white;
        }

        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                background: white;
                padding: 1rem;
                border-radius: 1rem;
                margin-top: 1rem;
            }
            .nav-links.show {
                display: flex;
            }
        }

        .subjects-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .subject-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 1.5rem;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
            text-align: center;
        }

        .subject-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tests-list {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .tests-list h2 {
            margin-bottom: 1.5rem;
            color: #1e3c72;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            transition: all 0.3s;
        }

        .test-item:hover {
            background: #f8f9fc;
            transform: translateX(5px);
        }

        .test-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .test-name {
            font-weight: 600;
            color: #1e3c72;
        }

        .test-questions {
            font-size: 0.8rem;
            color: #666;
        }

        .start-test-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .footer {
            background: #1a1a2e;
            color: #ccc;
            margin-top: 3rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
        }

        .copyright {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🩺</span>
                <div>
                    <h1>RPrep</h1>
                    <p>Your Nursing Success Partner</p>
                </div>
            </div>
            
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </header>

    <div id="mainContent">
        <div class="loading">
            <div class="spinner" style="width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#e74c3c;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem;"></div>
            <p>Loading tests...</p>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>🩺 RPrep</h4>
                <p>Empowering future nurses.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
        <div class="copyright">© 2026 RPrep - All rights reserved.</div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }

        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        // Get subject from URL
        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');
        const subjectName = urlParams.get('name');

        // Sample tests data (will come from Firebase)
        const testsData = {
            "med_surg": [
                { id: 1, name: "Cardiovascular System Disorders", questions: 20 },
                { id: 2, name: "Respiratory System Disorders", questions: 20 },
                { id: 3, name: "Gastrointestinal System Disorders", questions: 20 },
                { id: 4, name: "Neurological System Disorders", questions: 20 },
                { id: 5, name: "Musculoskeletal System Disorders", questions: 20 }
            ],
            "pharma": [
                { id: 1, name: "Antibiotics & Antimicrobials", questions: 20 },
                { id: 2, name: "Cardiovascular Drugs", questions: 20 },
                { id: 3, name: "CNS Drugs", questions: 20 }
            ],
            "foundation": [
                { id: 1, name: "Nursing Process & Care Plan", questions: 20 },
                { id: 2, name: "Infection Control Practices", questions: 20 },
                { id: 3, name: "Vital Signs Assessment", questions: 20 }
            ]
        };

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const mainContent = document.getElementById('mainContent');
            const tests = testsData[subjectId] || testsData["med_surg"];

            mainContent.innerHTML = `
                <div class="subjects-container">
                    <div class="subject-header">
                        <h1>📚 ${subjectName || 'Nursing'}</h1>
                        <p>Select a test to start practicing</p>
                        <button class="back-btn" onclick="window.location.href='dashboard.html'">
                            ← Back to Dashboard
                        </button>
                    </div>

                    <div class="tests-list">
                        <h2><i class="fas fa-vial"></i> Available Tests</h2>
                        ${tests.map(test => `
                            <div class="test-item">
                                <div class="test-info">
                                    <span class="test-name">📋 Test ${test.id}: ${test.name}</span>
                                    <span class="test-questions">${test.questions} MCQs</span>
                                </div>
                                <button class="start-test-btn" onclick="startTest('${subjectName}', ${test.id}, '${test.name}')">
                                    Start Test →
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        function startTest(subject, testId, topic) {
            sessionStorage.setItem('testSubject', subject);
            sessionStorage.setItem('testId', testId);
            sessionStorage.setItem('testTopic', topic);
            window.location.href = `test.html?subject=${encodeURIComponent(subject)}&test=${testId}&topic=${encodeURIComponent(topic)}`;
        }
    </script>
</body>
</html>
