<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel V3.0 - RPrep</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #3730a3; --success: #059669;
            --danger: #dc2626; --warning: #ea580c; --text: #1e293b;
            --text-light: #64748b; --border: #e2e8f0; --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #f0fdf4 100%);
            min-height: 100vh; color: var(--text);
        }
        .admin-header {
            background: #fff; border-bottom: 1px solid var(--border);
            padding: 16px 24px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 12px;
        }
        .admin-header .logo {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-light); }
        .btn-logout { background: #fee2e2; color: var(--danger); border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-logout:hover { background: #fecaca; }
        .main-container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

        .card { background: #fff; border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid var(--border); }
        .card h3 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: #f8fafc; }
        .form-group textarea { min-height: 160px; font-family: 'Courier New', monospace; font-size: 12px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: #fff; }

        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; transition: 0.25s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-outline { background: #fff; border: 2px solid var(--primary); color: var(--primary); }
        .btn-shuffle { background: #7c3aed; color: #fff; }
        .btn-generate { background: #059669; color: #fff; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 8px; }
        .btn-xs { padding: 4px 8px; font-size: 10px; border-radius: 6px; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

        .msg { padding: 10px 14px; border-radius: 10px; margin-top: 10px; font-size: 12px; font-weight: 600; display: none; white-space: pre-line; }
        .msg.show { display: block; }
        .msg-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .msg-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        .upload-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
        .upload-table th, .upload-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        .upload-table th { background: #f8fafc; font-weight: 700; color: var(--text-light); font-size: 10px; text-transform: uppercase; }
        .upload-table tr:hover { background: #f8fafc; }

        .badge { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
        .badge-success { background: #ecfdf5; color: #059669; }
        .badge-primary { background: #eef2ff; color: #4f46e5; }
        .badge-warning { background: #fff7ed; color: #ea580c; }

        .stats-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-mini { background: #f8fafc; border-radius: 12px; padding: 14px; text-align: center; border: 1px solid var(--border); }
        .stat-mini .num { font-size: 24px; font-weight: 800; color: var(--text); }
        .stat-mini .lbl { font-size: 10px; color: var(--text-light); text-transform: uppercase; margin-top: 2px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #f1f5f9; padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; background: transparent; color: var(--text-light); }
        .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

        .shuffle-stats { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 12px; display: none; }

        @media (max-width: 768px) {
            .form-row, .form-row-3 { grid-template-columns: 1fr; }
            .stats-mini { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div id="appRoot"></div>

    <script>
const ALL_SUBJECTS = [
            { id: "medical-surgical-nursing", name: "💊 Medical Surgical Nursing" },
            { id: "obstetrics-and-gynaecology", name: "🤰 Obstetrics & Gynaecology" },
            { id: "pediatric-nursing", name: "👶 Pediatric Nursing" },
            { id: "mental-health-nursing", name: "🧠 Mental Health Nursing" },
            { id: "community-health-nursing", name: "🌍 Community Health Nursing" },
            { id: "nursing-management", name: "🏥 Nursing Management" },
            { id: "anatomy-and-physiology", name: "🔬 Anatomy & Physiology" },
            { id: "pharmacology", name: "💉 Pharmacology" },
            { id: "microbiology", name: "🧫 Microbiology" },
            { id: "research-and-statistics", name: "📊 Research & Statistics" },
            { id: "nursing-foundation", name: "📘 Nursing Foundation" },
            { id: "nutrition", name: "🍎 Nutrition" },
            { id: "biochemistry", name: "🧬 Biochemistry" },
            { id: "pathology", name: "🩸 Pathology" },
            { id: "infection-control", name: "🦠 Infection Control" },
            { id: "first-aid-and-emergency", name: "⚕️ First Aid & Emergency" }
        ];

        // Default weightage for 100 MCQs
        const DEFAULT_WEIGHTAGE_365 = {
            "medical-surgical-nursing": 20, "pharmacology": 12, "mental-health-nursing": 10,
            "pediatric-nursing": 10, "obstetrics-and-gynaecology": 8, "community-health-nursing": 8,
            "nursing-management": 7, "anatomy-and-physiology": 7, "nursing-foundation": 6,
            "research-and-statistics": 4, "microbiology": 3, "nutrition": 2,
            "biochemistry": 1, "pathology": 1, "infection-control": 1, "first-aid-and-emergency": 0
        };

        const DEFAULT_WEIGHTAGE_NORCET = {
            "medical-surgical-nursing": 25, "pharmacology": 15, "mental-health-nursing": 12,
            "pediatric-nursing": 12, "obstetrics-and-gynaecology": 10, "community-health-nursing": 8,
            "nursing-management": 8, "anatomy-and-physiology": 5, "research-and-statistics": 3,
            "nursing-foundation": 2, "microbiology": 0, "nutrition": 0,
            "biochemistry": 0, "pathology": 0, "infection-control": 0, "first-aid-and-emergency": 0
        };

        let currentTab = 'subject';

        // ✅ Admin check
        async function isAdmin(user) {
            if (!user) return false;
            const snap = await db.collection('admins').doc(user.uid).get();
            return snap.exists;
        }

        auth.onAuthStateChanged(async function(user) {
            if (!user) { showLoginForm(); return; }
            const admin = await isAdmin(user);
            if (!admin) {
                document.getElementById('appRoot').innerHTML = `
                    <div style="max-width:500px;margin:60px auto;background:#fff;padding:40px;border-radius:18px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);">
                        <h2 style="color:var(--danger);">🚫 Access Denied</h2>
                        <p>You do not have admin privileges.</p>
                        <a href="dashboard.html" style="font-weight:600;color:var(--primary);">Go to Dashboard</a>
                    </div>`;
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 3000);
                return;
            }
            showAdminPanel();
            loadStats();
        });

        function showLoginForm() {
            document.getElementById('appRoot').innerHTML = `
                <div style="max-width:400px;margin:60px auto;background:#fff;padding:32px;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;">
                    <h3>🔐 Admin Login</h3>
                    <input type="email" id="loginEmail" placeholder="Admin Email" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin-bottom:10px;">
                    <input type="password" id="loginPassword" placeholder="Password" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin-bottom:10px;">
                    <button class="btn btn-success" onclick="adminLogin()" style="width:100%;">🚀 Login</button>
                    <div class="msg" id="loginMsg" style="margin-top:12px;"></div>
                </div>`;
        }

        window.adminLogin = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msgDiv = document.getElementById('loginMsg');
            if (!email || !password) { msgDiv.textContent = '❌ Enter email and password.'; msgDiv.className = 'msg show msg-error'; return; }
            try {
                msgDiv.textContent = '⏳ Logging in...'; msgDiv.className = 'msg show msg-info';
                await auth.signInWithEmailAndPassword(email, password);
            } catch(e) { msgDiv.textContent = '❌ ' + e.message; msgDiv.className = 'msg show msg-error'; }
        };

        function showAdminPanel() {
            document.getElementById('appRoot').innerHTML = `
                <div class="admin-header">
                    <div class="logo">📋 RPrep Admin Panel V3.0</div>
                    <div class="user-info">
                        <span>👤 ${auth.currentUser?.email || 'Admin'}</span>
                        <button class="btn-logout" onclick="auth.signOut()">🚪 Logout</button>
                    </div>
                </div>
                <div class="main-container">
                    <div class="stats-mini">
                        <div class="stat-mini"><div class="num" id="statTotal">0</div><div class="lbl">Total Tests</div></div>
                        <div class="stat-mini"><div class="num" id="statToday">0</div><div class="lbl">Today</div></div>
                        <div class="stat-mini"><div class="num" id="statLast">-</div><div class="lbl">Last Upload</div></div>
                        <div class="stat-mini"><div class="num" id="statDaily">0</div><div class="lbl">Daily Tests</div></div>
                    </div>

                    <div class="card">
                        <div class="tabs">
                            <button class="tab-btn active" onclick="switchTab('subject')">📚 Subject Tests</button>
                            <button class="tab-btn" onclick="switchTab('daily')">🔥 365 Days</button>
                            <button class="tab-btn" onclick="switchTab('auto')">🤖 Auto-Generate</button>
                        </div>

                        <!-- SUBJECT TEST TAB -->
                        <div class="tab-content active" id="tabSubject">
                            <div class="form-row">
                                <div class="form-group"><label>📚 Subject</label><select id="uploadSubject">${ALL_SUBJECTS.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
                                <div class="form-group"><label>📝 Topic Name</label><input type="text" id="topicName" placeholder="Leave empty to use subject name"></div>
                            </div>
                            <div class="form-row-3">
                                <div class="form-group"><label>🔢 Test Number</label><input type="number" id="testNumber" min="1" value="1"></div>
                                <div class="form-group"><label>📝 Total Questions</label><input type="number" id="totalQuestions" min="1" max="200" value="60"></div>
                                <div class="form-group"><label>⏱️ Time Limit (min)</label><input type="number" id="timeLimit" min="1" max="180" value="60"></div>
                            </div>
                            <div class="form-group"><label>📝 JSON Test Data</label><textarea id="jsonInput" placeholder='Paste JSON array...'></textarea></div>
                            <div class="btn-row">
                                <button class="btn btn-primary" onclick="validateJSON()">✅ Validate</button>
                                <button class="btn btn-shuffle" onclick="shuffleAnswers()">🔀 Shuffle Answers</button>
                                <button class="btn btn-success" onclick="uploadSubjectTest()">🚀 Upload</button>
                                <button class="btn btn-outline" onclick="generateSample()">📋 Sample</button>
                            </div>
                            <div class="shuffle-stats" id="shuffleStats"></div>
                            <div class="msg" id="msgSubject"></div>
                        </div>

                        <!-- 365 DAYS TAB -->
                        <div class="tab-content" id="tabDaily">
                            <div class="form-row">
                                <div class="form-group"><label>📅 Day Number (1-365)</label><input type="number" id="dailyDayNumber" min="1" max="365" value="1"></div>
                                <div class="form-group"><label>📚 Subject Focus</label><input type="text" id="dailySubject" placeholder="e.g., Medical-Surgical Nursing"></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>📝 Total Questions</label><input type="number" id="dailyTotalQuestions" min="1" max="200" value="60"></div>
                                <div class="form-group"><label>⏱️ Time Limit (min)</label><input type="number" id="dailyTimeLimit" min="1" max="180" value="60"></div>
                            </div>
                            <div class="form-group"><label>📝 JSON Test Data</label><textarea id="dailyJsonInput" placeholder='Paste JSON array...'></textarea></div>
                            <div class="btn-row">
                                <button class="btn btn-primary" onclick="validateDailyJSON()">✅ Validate</button>
                                <button class="btn btn-shuffle" onclick="shuffleDailyAnswers()">🔀 Shuffle Answers</button>
                                <button class="btn btn-warning" onclick="uploadDailyTest()">🔥 Upload Day</button>
                                <button class="btn btn-outline" onclick="generateDailySample()">📋 Sample</button>
                            </div>
                            <div class="shuffle-stats" id="dailyShuffleStats"></div>
                            <div class="msg" id="msgDaily"></div>
                        </div>

                        <!-- AUTO-GENERATE TAB -->
                        <div class="tab-content" id="tabAuto">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>🏆 Challenge</label>
                                    <select id="autoChallenge" onchange="updateWeightage()">
                                        <option value="365">🔥 365 Days Challenge</option>
                                        <option value="norcet">🏥 NORCET 100 Days</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>📝 MCQs per Test</label>
                                    <input type="number" id="autoMCQCount" value="100" min="10" max="200">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>📅 Number of Days</label><input type="number" id="autoDays" value="7" min="1" max="30"></div>
                                <div class="form-group"><label>📅 Start Day</label><input type="number" id="autoStartDay" value="1" min="1" max="365"></div>
                            </div>
                            <h4 style="margin-bottom:8px;">📊 Subject Weightage</h4>
                            <div class="form-row-3" id="weightageContainer"></div>
                            <div class="btn-row">
                                <button class="btn btn-generate" onclick="autoGenerateTests()">🤖 Generate Tests</button>
                            </div>
                            <div class="msg" id="msgAuto"></div>
                        </div>
                    </div>

                    <!-- RECENT UPLOADS -->
                    <div class="card">
                        <h3>📋 Recent Uploads</h3>
                        <div class="filter-row">
                            <select id="filterType" onchange="loadRecentUploads()" style="padding:6px 12px;border-radius:8px;border:2px solid #e2e8f0;">
                                <option value="all">All Tests</option>
                                <option value="subject">Subject Tests</option>
                                <option value="daily">365 Days Challenge</option>
                            </select>
                            <button class="btn btn-sm btn-outline" onclick="loadRecentUploads()">🔄 Refresh</button>
                        </div>
                        <div style="overflow-x:auto;" id="recentTableContainer"></div>
                    </div>
                </div>
            `;
            updateWeightage();
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            const tabs = ['subject', 'daily', 'auto'];
            const idx = tabs.indexOf(tab);
            document.querySelectorAll('.tab-btn')[idx].classList.add('active');
            document.getElementById('tab' + (tab === 'auto' ? 'Auto' : tab === 'daily' ? 'Daily' : 'Subject')).classList.add('active');
        };

        // ============ SHUFFLE FUNCTIONS ============
        function shuffleMCQs(data) {
            return data.map(mcq => {
                const correctAnswer = mcq.options[mcq.correct];
                const newCorrect = Math.floor(Math.random() * 4);
                if (newCorrect !== mcq.correct) {
                    const temp = mcq.options[mcq.correct];
                    mcq.options[mcq.correct] = mcq.options[newCorrect];
                    mcq.options[newCorrect] = temp;
                }
                mcq.correct = newCorrect;
                return mcq;
            });
        }

        function getDistribution(data) {
            const dist = {0:0, 1:0, 2:0, 3:0};
            data.forEach(q => dist[q.correct]++);
            return dist;
        }

        window.shuffleAnswers = function() {
            const jsonText = document.getElementById('jsonInput').value.trim();
            if (!jsonText) { showMsg(document.getElementById('msgSubject'), '❌ Paste JSON first.', 'error'); return; }
            try {
                let data = JSON.parse(jsonText);
                data = shuffleMCQs(data);
                document.getElementById('jsonInput').value = JSON.stringify(data, null, 2);
                const dist = getDistribution(data);
                const total = data.length;
                document.getElementById('shuffleStats').style.display = 'block';
                document.getElementById('shuffleStats').innerHTML = 
                    `🔀 Shuffled! A: ${dist[0]} (${Math.round(dist[0]/total*100)}%), B: ${dist[1]} (${Math.round(dist[1]/total*100)}%), C: ${dist[2]} (${Math.round(dist[2]/total*100)}%), D: ${dist[3]} (${Math.round(dist[3]/total*100)}%)`;
                showMsg(document.getElementById('msgSubject'), '✅ Answers shuffled successfully!', 'success');
            } catch(e) { showMsg(document.getElementById('msgSubject'), '❌ Invalid JSON.', 'error'); }
        };

        window.shuffleDailyAnswers = function() {
            const jsonText = document.getElementById('dailyJsonInput').value.trim();
            if (!jsonText) { showMsg(document.getElementById('msgDaily'), '❌ Paste JSON first.', 'error'); return; }
            try {
                let data = JSON.parse(jsonText);
                data = shuffleMCQs(data);
                document.getElementById('dailyJsonInput').value = JSON.stringify(data, null, 2);
                const dist = getDistribution(data);
                const total = data.length;
                document.getElementById('dailyShuffleStats').style.display = 'block';
                document.getElementById('dailyShuffleStats').innerHTML = 
                    `🔀 Shuffled! A: ${dist[0]} (${Math.round(dist[0]/total*100)}%), B: ${dist[1]} (${Math.round(dist[1]/total*100)}%), C: ${dist[2]} (${Math.round(dist[2]/total*100)}%), D: ${dist[3]} (${Math.round(dist[3]/total*100)}%)`;
                showMsg(document.getElementById('msgDaily'), '✅ Answers shuffled successfully!', 'success');
            } catch(e) { showMsg(document.getElementById('msgDaily'), '❌ Invalid JSON.', 'error'); }
        };

        // ============ AUTO-GENERATE ============
        window.updateWeightage = function() {
            const challenge = document.getElementById('autoChallenge').value;
            const weightage = challenge === 'norcet' ? DEFAULT_WEIGHTAGE_NORCET : DEFAULT_WEIGHTAGE_365;
            const container = document.getElementById('weightageContainer');
            if (!container) return;
            container.innerHTML = ALL_SUBJECTS.map(s => 
                `<div class="form-group"><label>${s.name}</label><input type="number" id="wg_${s.id}" value="${weightage[s.id] || 0}" min="0" max="100"></div>`
            ).join('');
        };

        window.autoGenerateTests = async function() {
            const challenge = document.getElementById('autoChallenge').value;
            const mcqCount = parseInt(document.getElementById('autoMCQCount').value) || 100;
            const days = parseInt(document.getElementById('autoDays').value) || 7;
            const startDay = parseInt(document.getElementById('autoStartDay').value) || 1;
            const msgDiv = document.getElementById('msgAuto');

            // Collect weightage
            const weightage = {};
            let totalW = 0;
            ALL_SUBJECTS.forEach(s => {
                const val = parseInt(document.getElementById('wg_' + s.id)?.value) || 0;
                weightage[s.id] = val;
                totalW += val;
            });

            if (totalW !== mcqCount) {
                showMsg(msgDiv, `⚠️ Weightage total (${totalW}) must equal MCQ count (${mcqCount}). Please adjust.`, 'error');
                return;
            }

            if (!confirm(`Generate ${days} tests (${mcqCount} MCQs each) for ${challenge === 'norcet' ? 'NORCET' : '365 Days'} starting Day ${startDay}?`)) return;

            const collection = challenge === 'norcet' ? 'norcet_tests' : 'tests';
            const testUrlBase = challenge === 'norcet' ? 'test.html' : 'test.html';

            showMsg(msgDiv, '⏳ Generating tests... This may take a few minutes.', 'info');

            let generated = 0;
            for (let d = 0; d < days; d++) {
                const dayNum = startDay + d;
                const selectedQuestions = [];

                for (const [subjectId, count] of Object.entries(weightage)) {
                    if (count === 0) continue;
                    // Fetch questions from subject_tests for this subject
                    const snap = await db.collection('subject_tests')
                        .where('subject_id', '==', subjectId)
                        .limit(10).get();
                    
                    let pool = [];
                    snap.forEach(doc => {
                        const qs = doc.data().questions || [];
                        pool = pool.concat(qs.map(q => ({...q, _subject: subjectId})));
                    });

                    // Randomly pick required count
                    const shuffled = pool.sort(() => Math.random() - 0.5);
                    const picked = shuffled.slice(0, Math.min(count, shuffled.length));
                    selectedQuestions.push(...picked);
                }

                // Shuffle and trim to exact count
                const finalQuestions = selectedQuestions.sort(() => Math.random() - 0.5).slice(0, mcqCount);

                if (finalQuestions.length < mcqCount) {
                    showMsg(msgDiv, `⚠️ Day ${dayNum}: Only ${finalQuestions.length}/${mcqCount} MCQs available. Need more MCQs in the bank.`, 'error');
                    continue;
                }

                const startDate = new Date(2026, 0, 1);
                startDate.setDate(startDate.getDate() + dayNum - 1);
                const dateStr = '2026-' + String(startDate.getMonth()+1).padStart(2,'0') + '-' + String(startDate.getDate()).padStart(2,'0');

                const docId = 'day-' + dayNum;
                await db.collection(collection).doc(docId).set({
                    day: dayNum,
                    date: dateStr,
                    subject_focus: 'Mixed',
                    total_questions: finalQuestions.length,
                    time_limit: 60,
                    questions: finalQuestions,
                    test_url: testUrlBase + '?day=' + dayNum,
                    solution_url: testUrlBase + '?day=' + dayNum + '&mode=solution',
                    uploaded_at: new Date().toISOString(),
                    uploaded_by: 'auto-generator',
                    auto_generated: true
                });
                generated++;
            }

            showMsg(msgDiv, `✅ Generated ${generated}/${days} tests successfully!`, 'success');
            loadStats();
            loadRecentUploads();
        };

        // ============ EXISTING FUNCTIONS (unchanged) ============
        window.validateJSON = function() {
            const jsonText = document.getElementById('jsonInput').value.trim();
            const expected = parseInt(document.getElementById('totalQuestions').value) || 60;
            const msgDiv = document.getElementById('msgSubject');
            if (!jsonText) { showMsg(msgDiv, '❌ Paste JSON.', 'error'); return; }
            try {
                const data = JSON.parse(jsonText);
                if (!Array.isArray(data)) { showMsg(msgDiv, '❌ Must be ARRAY.', 'error'); return; }
                if (data.length !== expected) { showMsg(msgDiv, `⚠️ Expected ${expected}, found ${data.length}.`, 'error'); return; }
                showMsg(msgDiv, `✅ Valid! ${data.length} questions.`, 'success');
            } catch(e) { showMsg(msgDiv, '❌ Invalid JSON.', 'error'); }
        };

        window.uploadSubjectTest = async function() {
            const subjectId = document.getElementById('uploadSubject').value;
            const topicName = document.getElementById('topicName').value.trim();
            const testNum = parseInt(document.getElementById('testNumber').value);
            const jsonText = document.getElementById('jsonInput').value.trim();
            const totalQ = parseInt(document.getElementById('totalQuestions').value) || 60;
            const timeLimit = parseInt(document.getElementById('timeLimit').value) || 60;
            const msgDiv = document.getElementById('msgSubject');
            if (!testNum || !jsonText) { showMsg(msgDiv, '❌ Fill all fields.', 'error'); return; }
            let data;
            try { data = JSON.parse(jsonText); } catch(e) { showMsg(msgDiv, '❌ Invalid JSON.', 'error'); return; }
            const docId = subjectId + '-test-' + String(testNum).padStart(3, '0');
            const subjectName = ALL_SUBJECTS.find(s => s.id === subjectId)?.name || subjectId;
            try {
                showMsg(msgDiv, '⏳ Uploading...', 'info');
                await db.collection('subject_tests').doc(docId).set({
                    subject_id: subjectId, subject_name: subjectName,
                    topic_name: topicName || subjectName, test_number: testNum,
                    total_questions: data.length, time_limit: timeLimit, questions: data,
                    test_url: 'subject-test.html?subject=' + subjectId + '&test=' + testNum,
                    solution_url: 'subject-test.html?subject=' + subjectId + '&test=' + testNum + '&mode=solution',
                    uploaded_at: new Date().toISOString(), uploaded_by: auth.currentUser?.email || 'admin'
                });
                showMsg(msgDiv, `✅ Test #${testNum} uploaded! (${timeLimit} min)`, 'success');
                document.getElementById('jsonInput').value = '';
                document.getElementById('testNumber').value = testNum + 1;
                loadStats(); loadRecentUploads();
            } catch(e) { showMsg(msgDiv, '❌ Failed: ' + e.message, 'error'); }
        };

        window.generateSample = function() {
            const count = parseInt(document.getElementById('totalQuestions').value) || 60;
            const subjectId = document.getElementById('uploadSubject').value;
            const topicName = document.getElementById('topicName').value.trim();
            const subjectName = ALL_SUBJECTS.find(s => s.id === subjectId)?.name || 'Nursing';
            const sample = [];
            for (let i = 1; i <= count; i++) {
                sample.push({
                    topic: topicName || subjectName,
                    question: `Q${i}: Sample question?`,
                    options: ["Option A", "Option B", "Option C", "Option D"],
                    correct: Math.floor(Math.random() * 4),
                    explanation: "Explanation for Q" + i + "."
                });
            }
            document.getElementById('jsonInput').value = JSON.stringify(sample, null, 2);
            showMsg(document.getElementById('msgSubject'), '📋 Sample generated!', 'info');
        };

        window.validateDailyJSON = function() {
            const jsonText = document.getElementById('dailyJsonInput').value.trim();
            const expected = parseInt(document.getElementById('dailyTotalQuestions').value) || 60;
            const msgDiv = document.getElementById('msgDaily');
            if (!jsonText) { showMsg(msgDiv, '❌ Paste JSON.', 'error'); return; }
            try {
                const data = JSON.parse(jsonText);
                if (!Array.isArray(data)) { showMsg(msgDiv, '❌ Must be ARRAY.', 'error'); return; }
                if (data.length !== expected) { showMsg(msgDiv, `⚠️ Need ${expected} questions, found ${data.length}.`, 'error'); return; }
                showMsg(msgDiv, `✅ Valid! ${data.length} questions.`, 'success');
            } catch(e) { showMsg(msgDiv, '❌ Invalid JSON.', 'error'); }
        };

        window.uploadDailyTest = async function() {
            const dayNum = parseInt(document.getElementById('dailyDayNumber').value);
            const subjectFocus = document.getElementById('dailySubject').value.trim();
            const jsonText = document.getElementById('dailyJsonInput').value.trim();
            const totalQ = parseInt(document.getElementById('dailyTotalQuestions').value) || 60;
            const timeLimit = parseInt(document.getElementById('dailyTimeLimit').value) || 60;
            const msgDiv = document.getElementById('msgDaily');
            if (!dayNum || dayNum < 1 || dayNum > 365) { showMsg(msgDiv, '❌ Day must be 1-365.', 'error'); return; }
            if (!jsonText) { showMsg(msgDiv, '❌ Paste JSON.', 'error'); return; }
            let data;
            try { data = JSON.parse(jsonText); } catch(e) { showMsg(msgDiv, '❌ Invalid JSON.', 'error'); return; }
            const startDate = new Date(2026, 0, 1);
            startDate.setDate(startDate.getDate() + dayNum - 1);
            const dateStr = '2026-' + String(startDate.getMonth()+1).padStart(2,'0') + '-' + String(startDate.getDate()).padStart(2,'0');
            try {
                showMsg(msgDiv, '⏳ Uploading Day ' + dayNum + '...', 'info');
                await db.collection('tests').doc('day-' + dayNum).set({
                    day: dayNum, date: dateStr, subject_focus: subjectFocus || 'Mixed',
                    total_questions: data.length, time_limit: timeLimit, questions: data,
                    test_url: 'test.html?day=' + dayNum,
                    solution_url: 'test.html?day=' + dayNum + '&mode=solution',
                    uploaded_at: new Date().toISOString(), uploaded_by: auth.currentUser?.email || 'admin'
                });
                showMsg(msgDiv, `✅ Day ${dayNum} uploaded! (${timeLimit} min)`, 'success');
                document.getElementById('dailyJsonInput').value = '';
                document.getElementById('dailyDayNumber').value = dayNum + 1;
                loadStats(); loadRecentUploads();
            } catch(e) { showMsg(msgDiv, '❌ Failed: ' + e.message, 'error'); }
        };

        window.generateDailySample = function() {
            const count = parseInt(document.getElementById('dailyTotalQuestions').value) || 60;
            const sample = [];
            for (let i = 1; i <= count; i++) {
                sample.push({
                    topic: "Daily Challenge",
                    question: `Day Question ${i}: Sample?`,
                    options: ["Option A", "Option B", "Option C", "Option D"],
                    correct: Math.floor(Math.random() * 4),
                    explanation: "Explanation " + i
                });
            }
            document.getElementById('dailyJsonInput').value = JSON.stringify(sample, null, 2);
            showMsg(document.getElementById('msgDaily'), '📋 Sample generated!', 'info');
        };

        async function loadStats() {
            try {
                const [subjectSnap, dailySnap] = await Promise.all([
                    db.collection('subject_tests').get(), db.collection('tests').get()
                ]);
                const total = subjectSnap.docs.length + dailySnap.docs.length;
                document.getElementById('statTotal').textContent = total;
                document.getElementById('statDaily').textContent = dailySnap.docs.length;
                let today = 0, lastDate = null;
                const todayStr = new Date().toISOString().split('T')[0];
                [...subjectSnap.docs, ...dailySnap.docs].forEach(d => {
                    const up = d.data().uploaded_at;
                    if (up?.startsWith(todayStr)) today++;
                    if (up) { const ud = new Date(up); if (!lastDate || ud > lastDate) lastDate = ud; }
                });
                document.getElementById('statToday').textContent = today;
                document.getElementById('statLast').textContent = lastDate ? lastDate.toLocaleDateString('en-IN') : '-';
            } catch(e) {}
        }

        async function loadRecentUploads() {
            const filterType = document.getElementById('filterType')?.value || 'all';
            try {
                let rows = [];
                if (filterType === 'all' || filterType === 'subject') {
                    const snap = await db.collection('subject_tests').orderBy('uploaded_at','desc').limit(25).get();
                    snap.forEach(d => {
                        const x = d.data();
                        rows.push({
                            type: 'subject', id: d.id,
                            label: (x.subject_name?.split(' ').pop()||'') + ' #' + x.test_number,
                            topic: x.topic_name || '-', questions: x.total_questions || 0,
                            time: x.time_limit || 60,
                            date: x.uploaded_at ? new Date(x.uploaded_at).toLocaleDateString('en-IN') : '-',
                            testUrl: x.test_url, solUrl: x.solution_url
                        });
                    });
                }
                if (filterType === 'all' || filterType === 'daily') {
                    const snap = await db.collection('tests').orderBy('day','desc').limit(25).get();
                    snap.forEach(d => {
                        const x = d.data();
                        rows.push({
                            type: 'daily', id: d.id, label: 'Day ' + x.day,
                            topic: x.subject_focus || 'Mixed', questions: x.total_questions || 60,
                            time: x.time_limit || 60,
                            date: x.uploaded_at ? new Date(x.uploaded_at).toLocaleDateString('en-IN') : '-',
                            testUrl: x.test_url, solUrl: x.solution_url
                        });
                    });
                }
                rows.sort((a, b) => new Date(b.date) - new Date(a.date));
                rows = rows.slice(0, 20);
                let html = `<table class="upload-table"><tr><th>Type</th><th>Test</th><th>Topic</th><th>Q</th><th>⏱️</th><th>Date</th><th>Links</th><th>Delete</th></tr>`;
                rows.forEach(r => {
                    html += `<tr>
                        <td><span class="badge ${r.type==='daily'?'badge-warning':'badge-success'}">${r.type==='daily'?'🔥 Daily':'📚 Subject'}</span></td>
                        <td><strong>${r.label}</strong></td>
                        <td><span class="badge badge-primary">${r.topic}</span></td>
                        <td>${r.questions}Q</td><td>${r.time} min</td><td>${r.date}</td>
                        <td><a href="${r.testUrl}" target="_blank">Test</a> | <a href="${r.solUrl}" target="_blank">Sol</a></td>
                        <td><button class="btn btn-danger btn-xs" onclick="deleteTest('${r.type}','${r.id}')">🗑️</button></td>
                    </tr>`;
                });
                html += '</table>';
                document.getElementById('recentTableContainer').innerHTML = html || 'No tests found.';
            } catch(e) { document.getElementById('recentTableContainer').innerHTML = 'Error loading.'; }
        }

        window.deleteTest = async function(type, docId) {
            if (!confirm('Delete this test?')) return;
            try {
                const collection = type === 'daily' ? 'tests' : 'subject_tests';
                await db.collection(collection).doc(docId).delete();
                loadStats(); loadRecentUploads();
            } catch(e) { alert('Failed: ' + e.message); }
        };

        function showMsg(div, msg, type) {
            div.textContent = msg; div.className = 'msg show msg-' + type;
            setTimeout(() => div.classList.remove('show'), 10000);
        }
    </script>
</body>
