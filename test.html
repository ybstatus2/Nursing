<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CBT Exam - RPrep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
        }

        /* ========== LANDSCAPE WARNING - FULL SCREEN ========== */
        .rotate-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }

        .rotate-warning .warning-inner {
            max-width: 90%;
            margin: 0 auto;
        }

        .rotate-warning i {
            font-size: 60px;
            animation: rotateAnim 2s ease infinite;
            display: inline-block;
        }

        .rotate-warning h2 {
            font-size: 22px;
            margin-top: 20px;
            font-weight: 600;
        }

        .rotate-warning p {
            font-size: 14px;
            margin-top: 12px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .rotate-warning .small-note {
            font-size: 11px;
            margin-top: 20px;
            opacity: 0.7;
        }

        @keyframes rotateAnim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        /* Portrait Mode - Show Warning */
        @media (orientation: portrait) {
            .rotate-warning {
                display: flex !important;
            }
            .exam-main-container {
                display: none !important;
            }
        }

        /* Landscape Mode - Hide Warning, Show Exam */
        @media (orientation: landscape) {
            .rotate-warning {
                display: none !important;
            }
            .exam-main-container {
                display: block !important;
            }
        }

        /* ========== CBT EXAM STYLES ========== */
        .exam-main-container {
            display: none;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #f0f2f5;
        }

        .exam-header {
            background: #ffffff;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e4e8;
            height: 50px;
        }

        .exam-title {
            font-size: 12px;
            font-weight: 600;
            color: #1e3c72;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .exam-title span {
            color: #e74c3c;
        }

        .timer-area {
            background: #1e3c72;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            font-family: monospace;
        }

        .timer-area.warning {
            background: #e74c3c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .exam-main {
            display: flex;
            padding: 8px;
            gap: 8px;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        .question-section {
            flex: 3;
            background: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .question-header {
            background: #f8f9fc;
            padding: 8px 12px;
            border-bottom: 1px solid #e0e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .q-num {
            font-weight: 700;
            color: #1e3c72;
            font-size: 12px;
        }

        .q-num span {
            background: #1e3c72;
            color: white;
            padding: 2px 8px;
            border-radius: 15px;
            margin-right: 6px;
            font-size: 11px;
        }

        .mark-btn {
            background: #ffc10720;
            border: 1px solid #ffc107;
            color: #d4a000;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .mark-btn.marked {
            background: #ffc107;
            color: #333;
        }

        .question-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .question-text {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #f8f9fc;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .option:hover {
            background: #eef2ff;
        }

        .option.selected {
            background: #eef2ff;
            border-color: #1e3c72;
        }

        .option-prefix {
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #1e3c72;
        }

        .option.selected .option-prefix {
            background: #1e3c72;
            color: white;
        }

        .option-text {
            flex: 1;
            font-size: 12px;
            color: #333;
        }

        .nav-buttons {
            padding: 8px 12px;
            border-top: 1px solid #e0e4e8;
            display: flex;
            gap: 8px;
            justify-content: space-between;
            background: #f8f9fc;
        }

        .cbt-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-prev {
            background: #e0e0e0;
            color: #333;
        }

        .btn-next {
            background: #1e3c72;
            color: white;
        }

        .btn-submit {
            background: #e74c3c;
            color: white;
        }

        .btn-prev:disabled, .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .palette-section {
            flex: 1;
            background: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 180px;
        }

        .palette-header {
            background: #f8f9fc;
            padding: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 11px;
            color: #1e3c72;
            border-bottom: 1px solid #e0e4e8;
        }

        .palette-grid {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            overflow-y: auto;
        }

        .palette-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            background: #f0f0f0;
            color: #333;
        }

        .palette-btn.answered {
            background: #2ecc71;
            color: white;
        }

        .palette-btn.marked {
            background: #ffc107;
            color: #333;
        }

        .palette-btn.current {
            background: #1e3c72;
            color: white;
            transform: scale(1.05);
        }

        .palette-btn.not-answered {
            background: #e74c3c;
            color: white;
        }

        .legend {
            padding: 6px 10px;
            border-top: 1px solid #e0e4e8;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            font-size: 9px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- ROTATION WARNING -->
    <div class="rotate-warning">
        <div class="warning-inner">
            <i class="fas fa-rotate-right"></i>
            <h2>Rotate Your Phone</h2>
            <p>Please rotate your phone to <strong>Landscape / Horizontal Mode</strong><br>for the best CBT exam experience.</p>
            <p class="small-note">ⓘ Test will start automatically after rotation</p>
        </div>
    </div>

    <!-- MAIN EXAM CONTAINER -->
    <div class="exam-main-container" id="examContent">
        <div class="loading-container">
            <div class="spinner"></div>
            <p style="margin-top: 12px;">Loading CBT Exam...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;
        let questions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let markedForReview = [];
        let timer = null;
        let timeLeft = 0;
        
        const urlParams = new URLSearchParams(window.location.search);
        const testSubject = urlParams.get('subject') || sessionStorage.getItem('testSubject') || 'Nursing';
        const testId = urlParams.get('test') || sessionStorage.getItem('testId') || '1';
        const testTopic = urlParams.get('topic') || sessionStorage.getItem('testTopic') || 'General';
        
        const storedQuestions = sessionStorage.getItem('testQuestions');
        if (storedQuestions) {
            questions = JSON.parse(storedQuestions);
        } else {
            questions = [
                { text: "A patient presents with chest pain radiating to left arm. What is the most likely diagnosis?", options: ["Angina Pectoris", "Myocardial Infarction", "Pericarditis", "GERD"], correct: 1 },
                { text: "Which of the following is the first-line treatment for hypertension?", options: ["ACE Inhibitors", "Beta Blockers", "Calcium Channel Blockers", "Thiazide Diuretics"], correct: 3 },
                { text: "Normal adult respiratory rate is:", options: ["8-12 breaths/min", "12-20 breaths/min", "20-28 breaths/min", "28-36 breaths/min"], correct: 1 },
                { text: "Which artery is palpated to check pulse in an unconscious patient?", options: ["Radial", "Brachial", "Carotid", "Femoral"], correct: 2 },
                { text: "The universal donor blood group is:", options: ["A", "B", "AB", "O"], correct: 3 }
            ];
        }
        
        userAnswers = new Array(questions.length).fill(null);
        markedForReview = new Array(questions.length).fill(false);
        currentIndex = 0;
        timeLeft = questions.length * 75;
        
        function saveToSession() {
            sessionStorage.setItem('testUserAnswers', JSON.stringify(userAnswers));
            sessionStorage.setItem('testMarkedForReview', JSON.stringify(markedForReview));
            sessionStorage.setItem('testCurrentIndex', currentIndex);
            sessionStorage.setItem('testTimeLeft', timeLeft);
        }
        
        function loadFromSession() {
            const savedAnswers = sessionStorage.getItem('testUserAnswers');
            const savedMarked = sessionStorage.getItem('testMarkedForReview');
            const savedIndex = sessionStorage.getItem('testCurrentIndex');
            const savedTime = sessionStorage.getItem('testTimeLeft');
            if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
            if (savedMarked) markedForReview = JSON.parse(savedMarked);
            if (savedIndex) currentIndex = parseInt(savedIndex);
            if (savedTime) timeLeft = parseInt(savedTime);
        }
        
        loadFromSession();
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            startExam();
        });
        
        function startExam() {
            startTimer();
            renderExam();
        }
        
        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitExam();
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                    saveToSession();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerEl = document.getElementById('timerDisplay');
            if (timerEl) {
                timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                if (timeLeft < 300) timerEl.classList.add('warning');
            }
        }
        
        function renderExam() {
            const container = document.getElementById('examContent');
            const question = questions[currentIndex];
            if (!question) return;
            
            let paletteHTML = '';
            questions.forEach((_, idx) => {
                let statusClass = 'not-answered';
                if (userAnswers[idx] !== null) statusClass = 'answered';
                else if (markedForReview[idx]) statusClass = 'marked';
                if (idx === currentIndex) statusClass = 'current';
                paletteHTML += `<button class="palette-btn ${statusClass}" onclick="goToQuestion(${idx})">${idx+1}</button>`;
            });
            
            let options = question.options;
            if (!options && question.a) options = [question.a, question.b, question.c, question.d];
            
            const isMarked = markedForReview[currentIndex];
            
            container.innerHTML = `
                <div class="exam-header">
                    <div class="exam-title"><i class="fas fa-stethoscope"></i> RPrep CBT | <span>${testSubject}</span></div>
                    <div class="timer-area" id="timerDisplay">00:00</div>
                </div>
                <div class="exam-main">
                    <div class="question-section">
                        <div class="question-header">
                            <div class="q-num"><span>Q${currentIndex+1}/${questions.length}</span> ${testTopic}</div>
                            <button class="mark-btn ${isMarked ? 'marked' : ''}" onclick="toggleMark()"><i class="fas fa-flag"></i> ${isMarked ? 'Marked' : 'Mark'}</button>
                        </div>
                        <div class="question-body">
                            <div class="question-text">${escapeHtml(question.text)}</div>
                            <div class="options-list">
                                ${options.map((opt, idx) => `
                                    <div class="option ${userAnswers[currentIndex] === idx ? 'selected' : ''}" onclick="selectOption(${idx})">
                                        <span class="option-prefix">${String.fromCharCode(65+idx)}</span>
                                        <span class="option-text">${escapeHtml(opt)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="nav-buttons">
                            <button class="cbt-btn btn-prev" onclick="prevQuestion()" ${currentIndex===0 ? 'disabled' : ''}>← Previous</button>
                            <button class="cbt-btn btn-next" onclick="nextQuestion()" ${currentIndex===questions.length-1 ? 'disabled' : ''}>Next →</button>
                            <button class="cbt-btn btn-submit" onclick="submitExam()">Submit</button>
                        </div>
                    </div>
                    <div class="palette-section">
                        <div class="palette-header"><i class="fas fa-th"></i> Question Palette</div>
                        <div class="palette-grid">${paletteHTML}</div>
                        <div class="legend">
                            <div class="legend-item"><div class="legend-color" style="background:#2ecc71;"></div> Answered</div>
                            <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div> Not Answered</div>
                            <div class="legend-item"><div class="legend-color" style="background:#ffc107;"></div> Marked</div>
                            <div class="legend-item"><div class="legend-color" style="background:#1e3c72;"></div> Current</div>
                        </div>
                    </div>
                </div>
            `;
            updateTimerDisplay();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function selectOption(optionIndex) { userAnswers[currentIndex] = optionIndex; renderExam(); saveToSession(); }
        function toggleMark() { markedForReview[currentIndex] = !markedForReview[currentIndex]; renderExam(); saveToSession(); }
        function nextQuestion() { if (currentIndex < questions.length - 1) { currentIndex++; renderExam(); saveToSession(); } }
        function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderExam(); saveToSession(); } }
        function goToQuestion(index) { currentIndex = index; renderExam(); saveToSession(); }
        
        function submitExam() {
            if (!confirm('Submit test?')) return;
            clearInterval(timer);
            let correctCount = 0;
            questions.forEach((q, idx) => {
                const correct = q.correct !== undefined ? q.correct : (q.answer ? parseInt(q.answer) : 0);
                if (userAnswers[idx] === correct) correctCount++;
            });
            const score = correctCount, total = questions.length, percentage = Math.round((score/total)*100);
            const results = { subject: testSubject, testId, topic: testTopic, score, total, percentage, questions, userAnswers, markedForReview, date: new Date().toISOString() };
            sessionStorage.setItem('testResults', JSON.stringify(results));
            if(currentUser) db.collection('results').add({ userId: currentUser.uid, subject: testSubject, testId, score, total, percentage, date: new Date() }).catch(e=>console.log(e));
            window.location.href = 'result.html';
        }
    </script>
<script src="app-update.js"></script>
</body>
</html>
