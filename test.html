<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exam - RPrep Nursing Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f5f7fa 0%,#e4e8f0 100%);min-height:100vh;}
        .exam-container{max-width:1400px;margin:0 auto;padding:1rem;min-height:100vh;display:flex;gap:1.5rem;flex-wrap:wrap;}
        .question-area{flex:2;min-width:280px;background:white;border-radius:1.5rem;padding:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
        .timer-bar{background:#1e3c72;color:white;padding:0.8rem 1.5rem;border-radius:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem;}
        .timer-display{font-size:1.5rem;font-weight:700;font-family:monospace;background:rgba(0,0,0,0.3);padding:0.3rem 1rem;border-radius:2rem;}
        .question-text{font-size:1.2rem;font-weight:600;color:#1e3c72;margin-bottom:1.5rem;line-height:1.5;}
        .options-list{display:flex;flex-direction:column;gap:1rem;margin-bottom:2rem;}
        .option{display:flex;align-items:center;gap:1rem;padding:1rem;background:#f8f9fc;border-radius:1rem;cursor:pointer;transition:all 0.3s;border:2px solid transparent;}
        .option:hover{background:#e8f0fe;transform:translateX(5px);}
        .option.selected{background:#e8f0fe;border-color:#e74c3c;}
        .option-prefix{font-weight:700;color:#1e3c72;width:35px;height:35px;display:flex;align-items:center;justify-content:center;background:white;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        .option.selected .option-prefix{background:#e74c3c;color:white;}
        .option-text{flex:1;color:#333;}
        .nav-buttons{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem;}
        .nav-btn{padding:0.8rem 1.5rem;border:none;border-radius:50px;font-weight:600;cursor:pointer;transition:all 0.3s;}
        .prev-btn{background:#e0e0e0;color:#333;}
        .next-btn{background:linear-gradient(135deg,#1e3c72,#2a5298);color:white;}
        .mark-btn{background:#ffc107;color:#333;}
        .skip-btn{background:#6c757d;color:white;}
        .submit-btn{background:linear-gradient(135deg,#e74c3c,#c0392b);color:white;margin-left:auto;}
        .palette-area{width:300px;background:white;border-radius:1.5rem;padding:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,0.1);height:fit-content;position:sticky;top:1rem;}
        .palette-title{font-weight:700;margin-bottom:1rem;color:#1e3c72;text-align:center;}
        .palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem;margin-bottom:1rem;}
        .palette-btn{aspect-ratio:1;border:none;border-radius:0.5rem;font-weight:600;cursor:pointer;background:#f0f0f0;color:#333;}
        .palette-btn.current{background:#1e3c72;color:white;transform:scale(1.05);}
        .palette-btn.answered{background:#2ecc71;color:white;}
        .palette-btn.marked{background:#ffc107;color:#333;}
        .palette-btn.not-answered{background:#e74c3c;color:white;}
        .legend{display:flex;flex-wrap:wrap;gap:0.8rem;margin-top:1rem;padding-top:1rem;border-top:1px solid #e0e0e0;font-size:0.7rem;}
        .legend-item{display:flex;align-items:center;gap:0.3rem;}
        .legend-color{width:15px;height:15px;border-radius:3px;}
        .loading-container{text-align:center;padding:4rem;}
        .spinner{width:50px;height:50px;border:4px solid #e0e0e0;border-top-color:#e74c3c;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem;}
        @keyframes spin{to{transform:rotate(360deg);}}
        @media (max-width:768px){.exam-container{flex-direction:column;}.palette-area{width:100%;position:static;}}
    </style>
</head>
<body>
    <div id="examContent"><div class="loading-container"><div class="spinner"></div><p>Loading exam...</p></div></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;
        let questions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let markedForReview = [];
        let timer = null;
        let timeLeft = 0;
        const STORAGE_KEY = `exam_${Date.now()}`;
        
        const urlParams = new URLSearchParams(window.location.search);
        const testSubject = urlParams.get('subject') || sessionStorage.getItem('testSubject') || 'Nursing';
        const testId = urlParams.get('test') || sessionStorage.getItem('testId') || '1';
        const testTopic = urlParams.get('topic') || sessionStorage.getItem('testTopic') || 'General';
        
        // Load questions from sessionStorage
        const storedQuestions = sessionStorage.getItem('testQuestions');
        if (storedQuestions) {
            questions = JSON.parse(storedQuestions);
        } else {
            // Fallback sample questions
            questions = [
                { text: "Sample Question 1", options: ["Option A", "Option B", "Option C", "Option D"], correct: 0 },
                { text: "Sample Question 2", options: ["Option A", "Option B", "Option C", "Option D"], correct: 1 }
            ];
        }
        
        userAnswers = new Array(questions.length).fill(null);
        markedForReview = [];
        currentIndex = 0;
        timeLeft = questions.length * 90; // 1.5 min per question
        
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            startExam();
        });
        
        function startExam() { startTimer(); renderExam(); }
        
        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                if (timeLeft <= 0) { clearInterval(timer); submitExam(); }
                else { timeLeft--; updateTimerDisplay(); }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerEl = document.getElementById('timerDisplay');
            if (timerEl) timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        }
        
        function renderExam() {
            const container = document.getElementById('examContent');
            const question = questions[currentIndex];
            if (!question) return;
            
            let paletteHTML = '';
            questions.forEach((_, idx) => {
                let statusClass = 'not-answered';
                if (userAnswers[idx] !== null) statusClass = 'answered';
                else if (markedForReview.includes(idx)) statusClass = 'marked';
                if (idx === currentIndex) statusClass = 'current';
                paletteHTML += `<button class="palette-btn ${statusClass}" onclick="goToQuestion(${idx})">${idx+1}</button>`;
            });
            
            // Handle options (support both array format and a,b,c,d format)
            let options = question.options;
            if (!options && question.a) {
                options = [question.a, question.b, question.c, question.d];
            }
            
            container.innerHTML = `
                <div class="exam-container">
                    <div class="question-area">
                        <div class="timer-bar"><span><i class="fas fa-clock"></i> Time Remaining</span><span class="timer-display" id="timerDisplay">00:00</span></div>
                        <div class="question-text"><span style="background:#e74c3c;color:white;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.8rem;">Q${currentIndex+1}/${questions.length}</span><div style="margin-top:0.8rem;">${question.text}</div></div>
                        <div class="options-list">${options.map((opt, idx) => `<div class="option ${userAnswers[currentIndex] === idx ? 'selected' : ''}" onclick="selectOption(${idx})"><span class="option-prefix">${String.fromCharCode(65+idx)}</span><span class="option-text">${opt}</span></div>`).join('')}</div>
                        <div class="nav-buttons">
                            <button class="nav-btn prev-btn" onclick="prevQuestion()" ${currentIndex===0?'disabled style="opacity:0.5"':''}>← Previous</button>
                            <button class="nav-btn mark-btn" onclick="markQuestion()"><i class="fas fa-flag"></i> Mark</button>
                            <button class="nav-btn skip-btn" onclick="nextQuestion()">Skip →</button>
                            <button class="nav-btn next-btn" onclick="nextQuestion()">Save & Next →</button>
                            <button class="nav-btn submit-btn" onclick="submitExam()"><i class="fas fa-check-circle"></i> Submit</button>
                        </div>
                    </div>
                    <div class="palette-area"><div class="palette-title">📋 Question Palette</div><div class="palette-grid">${paletteHTML}</div><div class="legend"><div class="legend-item"><div class="legend-color" style="background:#2ecc71;"></div> Answered</div><div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div> Not Answered</div><div class="legend-item"><div class="legend-color" style="background:#ffc107;"></div> Marked</div><div class="legend-item"><div class="legend-color" style="background:#1e3c72;"></div> Current</div></div></div>
                </div>`;
            updateTimerDisplay();
        }
        
        function selectOption(optionIndex) { userAnswers[currentIndex] = optionIndex; renderExam(); }
        function markQuestion() { if(markedForReview.includes(currentIndex)) markedForReview = markedForReview.filter(i=>i!==currentIndex); else markedForReview.push(currentIndex); renderExam(); }
        function nextQuestion() { if(currentIndex < questions.length-1) { currentIndex++; renderExam(); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; renderExam(); } }
        function goToQuestion(index) { currentIndex = index; renderExam(); }
        
        function submitExam() {
            clearInterval(timer);
            let correctCount = 0;
            questions.forEach((q, idx) => {
                const correct = q.correct !== undefined ? q.correct : (q.answer ? parseInt(q.answer) : 0);
                if (userAnswers[idx] === correct) correctCount++;
            });
            const score = correctCount, total = questions.length, percentage = Math.round((score/total)*100);
            const results = { subject: testSubject, testId, topic: testTopic, score, total, percentage, questions, userAnswers, date: new Date().toISOString() };
            sessionStorage.setItem('testResults', JSON.stringify(results));
            if(currentUser) db.collection('results').add({ userId: currentUser.uid, subject: testSubject, testId, score, total, percentage, date: new Date() });
            window.location.href = 'result.html';
        }
    </script>
</body>
</html>
