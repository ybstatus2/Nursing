<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Result - RPrep Nursing Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .result-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .score-card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .score-number {
            font-size: 3rem;
            font-weight: 800;
            color: #1e3c72;
        }

        .score-percentage {
            font-size: 2rem;
            font-weight: 800;
            color: #e74c3c;
        }

        .result-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .action-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dashboard-btn {
            background: #1e3c72;
            color: white;
        }

        .solutions-btn {
            background: #e74c3c;
            color: white;
        }

        @media (max-width: 768px) {
            .result-container {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🩺</span>
                <div><h1>RPrep</h1><p>Your Nursing Success Partner</p></div>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </header>

    <div id="resultContent">
        <div class="result-container">
            <div class="loading-container">
                <div class="spinner"></div>
                <p>Loading results...</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>🩺 RPrep</h4>
                <p>Empowering future nurses.</p>
            </div>
        </div>
        <div class="copyright">© 2026 RPrep - All rights reserved.</div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const results = JSON.parse(sessionStorage.getItem('testResults') || '{}');
            
            if (!results.score) {
                window.location.href = 'dashboard.html';
                return;
            }

            const percentage = results.percentage;
            let message = '';
            let emoji = '';
            
            if (percentage >= 90) {
                message = 'Excellent! You\'re a nursing star! 🌟';
                emoji = '🏆';
            } else if (percentage >= 75) {
                message = 'Great job! Keep it up! 👍';
                emoji = '🎉';
            } else if (percentage >= 60) {
                message = 'Good effort! Practice more! 📚';
                emoji = '💪';
            } else {
                message = 'Keep practicing! You\'ll get there! 💯';
                emoji = '❤️';
            }

            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="result-container">
                    <div class="score-card">
                        <h2>📋 Test Results</h2>
                        <p style="color:#666; margin-bottom:1rem;">${results.subject} - ${results.topic}</p>
                        
                        <div class="score-number">${results.score} / ${results.total}</div>
                        <div class="score-percentage">${results.percentage}%</div>
                        
                        <p style="margin-top:1rem; font-size:1.1rem;">${emoji} ${message}</p>
                        
                        <div class="result-actions">
                            <a href="dashboard.html" class="action-btn dashboard-btn">
                                ← Back to Dashboard
                            </a>
                            <a href="solutions.html" class="action-btn solutions-btn">
                                View Solutions →
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
