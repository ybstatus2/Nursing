<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPrep Admin Panel</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui;background:#f4f7fb;color:#111827}
    header{background:#111827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    header h1{font-size:20px;margin:0}
    .wrap{max-width:1150px;margin:auto;padding:18px}
    .card{background:white;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    label{font-weight:700;font-size:13px;margin-bottom:5px;display:block}
    input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:14px}
    textarea{min-height:180px;font-family:monospace}
    button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}
    .primary{background:#2563eb;color:white}
    .green{background:#059669;color:white}
    .purple{background:#7c3aed;color:white}
    .red{background:#dc2626;color:white}
    .gray{background:#e5e7eb;color:#111827}
    .msg{white-space:pre-line;background:#f3f4f6;padding:10px;border-radius:10px;margin-top:10px;font-size:13px}
    .tabs button{background:#e5e7eb}
    .tabs button.active{background:#111827;color:white}
    .hidden{display:none}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
    th{background:#f9fafb}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <h1>RPrep Admin Panel</h1>
  <div>
    <span id="userInfo">Not logged in</span>
    <button class="gray" onclick="logout()">Logout</button>
  </div>
</header>

<div class="wrap">

  <section class="card" id="loginCard">
    <h2>Admin Login</h2>
    <div class="grid">
      <div><label>Email</label><input id="email" type="email"></div>
      <div><label>Password</label><input id="password" type="password"></div>
    </div>
    <button class="primary" onclick="login()">Login</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <main id="adminArea" class="hidden">

    <section class="card">
      <div class="tabs">
        <button class="active" onclick="showTab('subject',this)">Subject Test Upload</button>
        <button onclick="showTab('series',this)">Test Series Upload</button>
        <button onclick="showTab('auto',this)">Auto Generate</button>
        <button onclick="showTab('latest',this)">Latest Tests</button>
      </div>
    </section>

    <section class="card tab" id="tab-subject">
      <h2>Subject Test Upload</h2>
      <div class="grid">
        <div><label>Subject</label><select id="subjectId"></select></div>
        <div><label>Topic Name</label><input id="subjectTopic" placeholder="e.g. Protein"></div>
        <div><label>Test Number</label><input id="subjectTestNumber" type="number" value="1"></div>
        <div><label>Time Limit</label><input id="subjectTimeLimit" type="number" value="30"></div>
      </div>
      <label>Questions JSON</label>
      <textarea id="subjectQuestions"></textarea>
      <button class="gray" onclick="sampleJson('subjectQuestions')">Sample</button>
      <button class="purple" onclick="shuffleBox('subjectQuestions','subjectMsg')">Shuffle Answers</button>
      <button class="primary" onclick="validateBox('subjectQuestions','subjectMsg')">Validate</button>
      <button class="green" onclick="uploadSubjectTest()">Upload Subject Test</button>
      <div id="subjectMsg" class="msg"></div>
    </section>

    <section class="card tab hidden" id="tab-series">
      <h2>Test Series Upload</h2>
      <div class="grid">
        <div><label>Series</label><select id="seriesId"></select></div>
        <div><label>Test Number / Day</label><input id="seriesTestNumber" type="number" value="1"></div>
        <div><label>Topic Name</label><input id="seriesTopic" placeholder="Auto: Series - Day 1"></div>
        <div><label>Unlock Date</label><input id="seriesUnlockDate" type="date"></div>
        <div><label>Time Limit</label><input id="seriesTimeLimit" type="number" value="30"></div>
      </div>
      <label>Questions JSON</label>
      <textarea id="seriesQuestions"></textarea>
      <button class="gray" onclick="sampleJson('seriesQuestions')">Sample</button>
      <button class="purple" onclick="shuffleBox('seriesQuestions','seriesMsg')">Shuffle Answers</button>
      <button class="primary" onclick="validateBox('seriesQuestions','seriesMsg')">Validate</button>
      <button class="green" onclick="uploadSeriesTest()">Upload Series Test</button>
      <div id="seriesMsg" class="msg"></div>
    </section>

    <section class="card tab hidden" id="tab-auto">
      <h2>Auto Generate From Subject Tests</h2>
      <div class="grid">
        <div><label>Series</label><select id="autoSeriesId"></select></div>
        <div><label>Test Number / Day</label><input id="autoTestNumber" type="number" value="1"></div>
        <div><label>Total Questions</label><input id="autoTotal" type="number" value="100"></div>
        <div><label>Time Limit</label><input id="autoTimeLimit" type="number" value="100"></div>
        <div><label>Unlock Date</label><input id="autoUnlockDate" type="date"></div>
      </div>
      <label>Weightage JSON</label>
      <textarea id="autoWeightage"></textarea>
      <button class="gray" onclick="fill365()">365 Weightage</button>
      <button class="gray" onclick="fillNorcet()">NORCET Weightage</button>
      <button class="green" onclick="autoGenerate()">Generate Test</button>
      <div id="autoMsg" class="msg"></div>
    </section>

    <section class="card tab hidden" id="tab-latest">
      <h2>Latest Tests</h2>
      <button class="primary" onclick="loadLatest()">Load Latest Tests</button>
      <div id="latestBox"></div>
    </section>

  </main>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBB6wEYXCeu-IhgdkbD4zEaBmSJ9xkCXC0",
  authDomain: "nursingstudyvaultprep.firebaseapp.com",
  projectId: "nursingstudyvaultprep",
  storageBucket: "nursingstudyvaultprep.firebasestorage.app",
  messagingSenderId: "583546522601",
  appId: "1:583546522601:web:1165a7805c400b05235978"
});

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAILS = ["pbhupeshk2022@gmail.com","pbhupeshk2021@gmail.com"];

const SUBJECTS = [
  ["medical-surgical-nursing","💊 Medical Surgical Nursing"],
  ["obstetrics-and-gynaecology","🤰 Obstetrics & Gynaecology"],
  ["pediatric-nursing","👶 Pediatric Nursing"],
  ["mental-health-nursing","🧠 Mental Health Nursing"],
  ["community-health-nursing","🌍 Community Health Nursing"],
  ["nursing-management","🏥 Nursing Management"],
  ["anatomy-and-physiology","🔬 Anatomy & Physiology"],
  ["pharmacology","💉 Pharmacology"],
  ["microbiology","🧫 Microbiology"],
  ["research-and-statistics","📊 Research & Statistics"],
  ["nursing-foundation","📘 Nursing Foundation"],
  ["nutrition","🍎 Nutrition"],
  ["biochemistry","🧬 Biochemistry"],
  ["pathology","🩸 Pathology"],
  ["infection-control","🦠 Infection Control"],
  ["first-aid-and-emergency","⚕️ First Aid & Emergency"]
];

const SERIES = {
  daily_morning: "Daily Morning Test",
  daily_evening: "Daily Evening Test",
  "365_days": "365 Days Challenge",
  "norcet_100_days": "NORCET 100 Days Challenge"
};

function init(){
  subjectId.innerHTML = SUBJECTS.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
  seriesId.innerHTML = Object.entries(SERIES).map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
  autoSeriesId.innerHTML = Object.entries(SERIES).filter(s=>["365_days","norcet_100_days"].includes(s[0])).map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
}
init();

auth.onAuthStateChanged(user=>{
  if(user && ADMIN_EMAILS.includes(user.email)){
    loginCard.classList.add("hidden");
    adminArea.classList.remove("hidden");
    userInfo.innerText = user.email;
  }else{
    loginCard.classList.remove("hidden");
    adminArea.classList.add("hidden");
    userInfo.innerText = "Not logged in";
  }
});

async function login(){
  try{
    loginMsg.innerText = "Logging in...";
    await auth.signInWithEmailAndPassword(email.value.trim(), password.value);
    loginMsg.innerText = "Login success";
  }catch(e){
    loginMsg.innerText = e.message;
  }
}
function logout(){ auth.signOut(); }

function showTab(name,btn){
  document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));
  document.getElementById("tab-"+name).classList.remove("hidden");
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

function pad(n){return String(n).padStart(3,"0")}
function slugSeries(id){return id.replaceAll("_","-")}
function today(){return new Date().toISOString().slice(0,10)}
function subjectName(id){return SUBJECTS.find(s=>s[0]===id)?.[1] || id}

function getJson(id){
  const data = JSON.parse(document.getElementById(id).value);
  if(!Array.isArray(data)) throw new Error("JSON must be array");
  data.forEach((q,i)=>{
    if(!q.question || !Array.isArray(q.options) || q.options.length !== 4) throw new Error("Invalid question at " + (i+1));
    if(q.correct === undefined || Number(q.correct) < 0 || Number(q.correct) > 3) throw new Error("Invalid correct index at " + (i+1));
  });
  return data;
}

function sampleJson(id){
  document.getElementById(id).value = JSON.stringify([
    {
      question:"Which nutrient is the main source of energy?",
      options:["Protein","Fat","Vitamin","Mineral"],
      correct:1,
      explanation:"Fat provides 9 kcal/g and is a concentrated energy source.",
      topic:"Nutrition"
    }
  ],null,2);
}

function validateBox(box,msg){
  try{
    const data = getJson(box);
    document.getElementById(msg).innerText = "Valid JSON. Questions: " + data.length;
  }catch(e){document.getElementById(msg).innerText = e.message}
}

function shuffleArr(a){return [...a].sort(()=>Math.random()-0.5)}

function shuffleBox(box,msg){
  try{
    let data = getJson(box);
    data = data.map(q=>{
      const correctText = q.options[Number(q.correct)];
      const opts = shuffleArr(q.options);
      return {...q, options:opts, correct:opts.indexOf(correctText)};
    });
    document.getElementById(box).value = JSON.stringify(data,null,2);
    document.getElementById(msg).innerText = "Shuffled again. You can press again.";
  }catch(e){document.getElementById(msg).innerText = e.message}
}

async function uploadSubjectTest(){
  try{
    const sid = subjectId.value;
    const tnum = Number(subjectTestNumber.value);
    const qs = getJson("subjectQuestions");
    const docId = `${sid}-test-${pad(tnum)}`;
    await db.collection("subject_tests").doc(docId).set({
      subject_id:sid,
      subject_name:subjectName(sid),
      topic_name:subjectTopic.value || subjectName(sid),
      test_number:tnum,
      time_limit:Number(subjectTimeLimit.value),
      total_questions:qs.length,
      questions:qs,
      test_url:`/p/subject-test.html?subject=${sid}&test=${tnum}`,
      solution_url:`/p/subject-test.html?subject=${sid}&test=${tnum}&mode=solution`,
      uploaded_at:new Date().toISOString(),
      uploaded_by:auth.currentUser.email
    });
    subjectMsg.innerText = "Uploaded: " + docId;
  }catch(e){subjectMsg.innerText = e.message}
}

async function uploadSeriesTest(){
  try{
    const sid = seriesId.value;
    const tnum = Number(seriesTestNumber.value);
    const qs = getJson("seriesQuestions");
    const name = SERIES[sid];
    const docId = `${slugSeries(sid)}-test-${pad(tnum)}`;
    await db.collection("subject_tests").doc(docId).set({
      series_id:sid,
      series_name:name,
      test_number:tnum,
      topic_name:seriesTopic.value || `${name} - Day ${tnum}`,
      unlockDate:seriesUnlockDate.value || today(),
      time_limit:Number(seriesTimeLimit.value),
      total_questions:qs.length,
      questions:qs,
      shuffleQuestions:true,
      shuffleOptions:true,
      uploaded_at:new Date().toISOString(),
      uploaded_by:auth.currentUser.email
    });
    seriesMsg.innerText = "Uploaded: " + docId;
  }catch(e){seriesMsg.innerText = e.message}
}

function fill365(){
  autoWeightage.value = JSON.stringify({
    "medical-surgical-nursing":25,
    "pharmacology":12,
    "mental-health-nursing":10,
    "pediatric-nursing":10,
    "obstetrics-and-gynaecology":10,
    "community-health-nursing":8,
    "nursing-management":7,
    "anatomy-and-physiology":6,
    "nursing-foundation":5,
    "research-and-statistics":3,
    "microbiology":2,
    "nutrition":2
  },null,2);
}
function fillNorcet(){
  autoWeightage.value = JSON.stringify({
    "medical-surgical-nursing":30,
    "pharmacology":15,
    "mental-health-nursing":12,
    "pediatric-nursing":10,
    "obstetrics-and-gynaecology":10,
    "community-health-nursing":8,
    "nursing-management":5,
    "anatomy-and-physiology":4,
    "nursing-foundation":3,
    "research-and-statistics":3
  },null,2);
}

async function getPool(sid){
  const snap = await db.collection("subject_tests").where("subject_id","==",sid).get();
  let pool=[];
  snap.forEach(d=>{
    const x=d.data();
    if(x.series_id) return;
    if(Array.isArray(x.questions)){
      pool.push(...x.questions.map(q=>({...q, subject:sid, topic:q.topic || x.topic_name || sid})));
    }
  });
  return pool;
}

async function autoGenerate(){
  try{
    const sid = autoSeriesId.value;
    const name = SERIES[sid];
    const tnum = Number(autoTestNumber.value);
    const total = Number(autoTotal.value);
    const weight = JSON.parse(autoWeightage.value || "{}");
    const sum = Object.values(weight).reduce((a,b)=>a+Number(b),0);
    if(sum !== total) throw new Error("Weightage total "+sum+" hai, Total Questions "+total+" hona chahiye.");

    autoMsg.innerText = "Generating...";
    let selected=[];
    for(const [sub,count] of Object.entries(weight)){
      const pool = await getPool(sub);
      if(pool.length < Number(count)) throw new Error(`${sub}: required ${count}, found ${pool.length}`);
      selected.push(...shuffleArr(pool).slice(0,Number(count)));
    }
    selected = shuffleArr(selected);

    const docId = `${slugSeries(sid)}-test-${pad(tnum)}`;
    await db.collection("subject_tests").doc(docId).set({
      series_id:sid,
      series_name:name,
      test_number:tnum,
      topic_name:`${name} - Day ${tnum}`,
      unlockDate:autoUnlockDate.value || today(),
      time_limit:Number(autoTimeLimit.value),
      total_questions:selected.length,
      questions:selected,
      shuffleQuestions:true,
      shuffleOptions:true,
      autoGenerated:true,
      weightage:weight,
      uploaded_at:new Date().toISOString(),
      uploaded_by:auth.currentUser.email
    });
    autoMsg.innerText = "Generated: " + docId;
  }catch(e){autoMsg.innerText = e.message}
}

async function loadLatest(){
  const snap = await db.collection("subject_tests").orderBy("uploaded_at","desc").limit(50).get();
  let html = "<table><tr><th>Doc ID</th><th>Type</th><th>Name</th><th>Test</th><th>Q</th><th>Action</th></tr>";
  snap.forEach(d=>{
    const x=d.data();
    html += `<tr>
      <td>${d.id}</td>
      <td>${x.series_id ? "Series" : "Subject"}</td>
      <td>${x.series_name || x.subject_name || "-"}<br><small>${x.topic_name || ""}</small></td>
      <td>${x.test_number || "-"}</td>
      <td>${x.total_questions || x.questions?.length || 0}</td>
      <td><button class="red" onclick="deleteTest('${d.id}')">Delete</button></td>
    </tr>`;
  });
  html += "</table>";
  latestBox.innerHTML = html;
}

async function deleteTest(id){
  if(!confirm("Delete " + id + "?")) return;
  await db.collection("subject_tests").doc(id).delete();
  loadLatest();
}
</script>
</body>
</html>
