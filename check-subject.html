<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Firebase Subject Tests</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e2e; color: #fff; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .info { color: #f39c12; }
        pre { background: #2d2d3d; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔍 Firebase Subject Tests Check</h1>
    <div id="output">Loading Firebase...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBB6wEYXCeu-IhgdkbD4zEaBmSJ9xkCXC0",
            authDomain: "nursingstudyvaultprep.firebaseapp.com",
            projectId: "nursingstudyvaultprep",
            storageBucket: "nursingstudyvaultprep.firebasestorage.app",
            messagingSenderId: "583546522601",
            appId: "1:583546522601:web:1165a7805c400b05235978"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const output = document.getElementById('output');

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                output.innerHTML = '<p class="error">❌ Please login first</p><a href="index.html" style="color:#2ecc71;">Go to Login</a>';
                return;
            }
            
            output.innerHTML = '<p>✅ Logged in as: ' + user.email + '</p>';
            output.innerHTML += '<p>🔍 Checking subject_tests collection for medical-surgical-nursing...</p>';
            
            // Method 1: Direct document lookup
            const docId1 = 'medical-surgical-nursing';
            const doc1 = await db.collection('subject_tests').doc(docId1).get();
            
            if (doc1.exists) {
                output.innerHTML += '<p class="success">✅ Found document: ' + docId1 + '</p>';
                const data = doc1.data();
                output.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } else {
                output.innerHTML += '<p class="error">❌ Document not found: ' + docId1 + '</p>';
            }
            
            // Method 2: Search by subject_id field
            output.innerHTML += '<p>🔍 Searching by subject_id field...</p>';
            const snapshot = await db.collection('subject_tests').where('subject_id', '==', 'medical-surgical-nursing').get();
            
            if (!snapshot.empty) {
                output.innerHTML += '<p class="success">✅ Found ' + snapshot.size + ' documents with subject_id = medical-surgical-nursing</p>';
                snapshot.forEach(doc => {
                    output.innerHTML += '<p><strong>Document ID:</strong> ' + doc.id + '</p>';
                    output.innerHTML += '<pre>' + JSON.stringify(doc.data(), null, 2) + '</pre>';
                });
            } else {
                output.innerHTML += '<p class="error">❌ No documents found with subject_id = medical-surgical-nursing</p>';
            }
            
            // Method 3: List all subject_tests documents
            output.innerHTML += '<p>🔍 Listing all subject_tests documents...</p>';
            const allDocs = await db.collection('subject_tests').limit(10).get();
            
            if (!allDocs.empty) {
                output.innerHTML += '<p class="success">✅ Found ' + allDocs.size + ' documents in subject_tests collection:</p>';
                allDocs.forEach(doc => {
                    const data = doc.data();
                    output.innerHTML += '<p><strong>ID:</strong> ' + doc.id + ' | <strong>Subject:</strong> ' + (data.subject_name || data.subject_id || 'N/A') + ' | <strong>Test #:</strong> ' + (data.test_number || 'N/A') + '</p>';
                });
            } else {
                output.innerHTML += '<p class="error">❌ subject_tests collection is empty!</p>';
            }
        });
    </script>
</body>
</html>
