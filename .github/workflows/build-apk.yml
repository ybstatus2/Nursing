name: Build RPrep APK

on:
  workflow_dispatch:
  push:
    branches: [ rprep-app ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rprep-mobile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RPrep-app-debug-apk
          path: rprep-mobile/android/app/build/outputs/apk/debug/app-debug.apk
